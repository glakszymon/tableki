<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NoteGrid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
<div id="app">

  <!-- ═══ SIDEBAR ════════════════════════════════════════════════ -->
  <aside class="sidebar">

    <div class="brand">
      <svg class="brand-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="1.5" y="1.5" width="17" height="17" rx="3.5" stroke="currentColor" stroke-width="1.3"/>
        <line x1="10" y1="3" x2="10" y2="17" stroke="currentColor" stroke-width="1.1"/>
        <line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.1"/>
        <line x1="10" y1="3" x2="9" y2="5.2" stroke="currentColor" stroke-width="1"/>
        <line x1="10" y1="3" x2="11" y2="5.2" stroke="currentColor" stroke-width="1"/>
        <line x1="17" y1="10" x2="14.8" y2="9" stroke="currentColor" stroke-width="1"/>
        <line x1="17" y1="10" x2="14.8" y2="11" stroke="currentColor" stroke-width="1"/>
      </svg>
      <span>NoteGrid</span>
    </div>

    <div class="sidebar-body">

      <!-- FORMAT KARTKI -->
      <section class="block">
        <h3 class="block-title">Format kartki</h3>

        <div class="format-grid">
          <button v-for="p in presets" :key="p.id"
            class="fmt-card" :class="{ active: activePreset === p.id }"
            @click="applyPreset(p)">
            <div class="fmt-thumb-wrap">
              <div class="fmt-thumb" :style="thumbStyle(p)"></div>
            </div>
            <div class="fmt-name">{{ p.label }}</div>
            <div class="fmt-size">{{ p.w }}&thinsp;×&thinsp;{{ p.h }}</div>
          </button>
        </div>

        <button class="rotate-btn" @click="rotateFormat">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M1.5 6.5A5 5 0 1 0 6.5 1.5V0L4 2l2.5 2V2.5a4 4 0 1 1-4 4H1.5z" fill="currentColor"/>
          </svg>
          Obróć format
        </button>

        <div class="custom-dims">
          <div class="field-xs">
            <label>Szerokość</label>
            <input type="number" v-model.number="cfg.pageW" min="200" max="6000" @input="onCustomSize" />
          </div>
          <div class="dims-sep">×</div>
          <div class="field-xs">
            <label>Wysokość</label>
            <input type="number" v-model.number="cfg.pageH" min="200" max="6000" @input="onCustomSize" />
          </div>
          <span class="dims-unit">pt</span>
        </div>
      </section>

      <!-- SEKCJE -->
      <section class="block">
        <h3 class="block-title">Sekcje arkusza</h3>

        <div class="sec-list">
          <div class="sec-row" v-for="s in cfg.sections" :key="s.id">
            <label class="sec-check">
              <input type="checkbox" v-model="s.enabled" @change="schedulePreview" />
              <span class="sec-box"></span>
            </label>
            <span class="sec-lbl" :class="{ muted: !s.enabled }">{{ s.name }}</span>
            <div class="sec-track" :class="{ muted: !s.enabled }">
              <div class="sec-fill" :style="{ width: (s.enabled ? s.pct : 0) + '%' }"></div>
              <input type="range" v-model.number="s.pct" min="5" max="90" step="1"
                :disabled="!s.enabled" @input="schedulePreview" />
            </div>
            <span class="sec-val" :class="{ muted: !s.enabled }">{{ s.enabled ? s.pct : 0 }}%</span>
          </div>
        </div>

        <div class="pct-status" :class="{ bad: pctSum !== 100 }">
          Suma {{ pctSum }}%
          <button class="micro-btn" @click="normalizePct">auto</button>
        </div>
      </section>

      <!-- SIATKA -->
      <section class="block">
        <h3 class="block-title">Układ współrzędnych</h3>

        <div class="four-grid">
          <div class="field-xs">
            <label>X min</label>
            <input type="number" v-model.number="cfg.xMin" @input="schedulePreview" />
          </div>
          <div class="field-xs">
            <label>X max</label>
            <input type="number" v-model.number="cfg.xMax" @input="schedulePreview" />
          </div>
          <div class="field-xs">
            <label>Y min</label>
            <input type="number" v-model.number="cfg.yMin" @input="schedulePreview" />
          </div>
          <div class="field-xs">
            <label>Y max</label>
            <input type="number" v-model.number="cfg.yMax" @input="schedulePreview" />
          </div>
        </div>

        <div class="two-grid" style="margin-top:8px">
          <div class="field-xs">
            <label>Krok</label>
            <input type="text" v-model="cfg.step" placeholder="1, 0.5, 1/2" @input="schedulePreview" />
          </div>
          <div class="field-xs">
            <label>Etykiety</label>
            <select v-model="cfg.labelType" @change="schedulePreview">
              <option value="fraction">Ułamkowe</option>
              <option value="decimal">Dziesiętne</option>
              <option value="none">Brak</option>
            </select>
          </div>
        </div>

        <div class="sw-list">
          <div class="sw-row" v-for="t in axisToggles" :key="t.key">
            <span>{{ t.label }}</span>
            <label class="sw">
              <input type="checkbox" v-model="cfg[t.key]" @change="schedulePreview" />
              <span class="sw-track"></span>
            </label>
          </div>
        </div>

        <!-- Marginesy siatki -->
        <div class="margin-block">
          <div class="margin-label">Marginesy układu (pt)</div>
          <div class="margin-cross">
            <div class="margin-top">
              <div class="field-xs">
                <label>Góra</label>
                <input type="number" v-model.number="cfg.gridMargin.top" min="0" max="200" @input="schedulePreview" />
              </div>
            </div>
            <div class="margin-mid">
              <div class="field-xs">
                <label>Lewo</label>
                <input type="number" v-model.number="cfg.gridMargin.left" min="0" max="200" @input="schedulePreview" />
              </div>
              <div class="margin-center-dot"></div>
              <div class="field-xs">
                <label>Prawo</label>
                <input type="number" v-model.number="cfg.gridMargin.right" min="0" max="200" @input="schedulePreview" />
              </div>
            </div>
            <div class="margin-bottom">
              <div class="field-xs">
                <label>Dół</label>
                <input type="number" v-model.number="cfg.gridMargin.bottom" min="0" max="200" @input="schedulePreview" />
              </div>
            </div>
          </div>
          <button class="micro-btn" style="margin-top:8px" @click="syncMargins">Wyrównaj wszystkie</button>
        </div>
      </section>

      <!-- WYGLĄD -->
      <section class="block">
        <h3 class="block-title">Wygląd</h3>

        <div class="color-rows">
          <div class="color-row" v-for="c in colorFields" :key="c.key">
            <span>{{ c.label }}</span>
            <div class="color-ctrl">
              <label class="swatch-btn" :style="{ background: cfg.colors[c.key] }">
                <input type="color" v-model="cfg.colors[c.key]" @input="schedulePreview" />
              </label>
              <input class="hex-in" type="text" v-model="cfg.colors[c.key]"
                @change="schedulePreview" maxlength="7" />
            </div>
          </div>
        </div>

        <div class="two-grid" style="margin-top:12px">
          <div class="field-xs">
            <label>Siatka (gr.)</label>
            <input type="number" v-model.number="cfg.gridLineW" min="0.1" max="3" step="0.1" @input="schedulePreview" />
          </div>
          <div class="field-xs">
            <label>Osie (gr.)</label>
            <input type="number" v-model.number="cfg.axisLineW" min="0.5" max="5" step="0.1" @input="schedulePreview" />
          </div>
        </div>
      </section>

    </div><!-- /sidebar-body -->

    <div class="sidebar-foot">
      <button class="foot-reset" @click="resetDefaults" title="Resetuj">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1.5 7A5.5 5.5 0 1 0 7 1.5V0L4.5 2 7 4V2.5a4.5 4.5 0 1 1-4.5 4.5H1.5z" fill="currentColor"/>
        </svg>
      </button>
      <button class="foot-gen" :class="{ loading: isGenerating }" @click="generate">
        <span v-if="!isGenerating">Generuj PDF</span>
        <span v-else class="gen-dots"><i></i><i></i><i></i></span>
      </button>
      <button class="foot-dl" :disabled="!pdfReady" @click="download">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M7.5 2v8M5 7.5l2.5 2.5 2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ═══ PREVIEW ════════════════════════════════════════════════ -->
  <main class="preview">
    <div class="preview-inner">
      <canvas ref="canvas" class="sheet-canvas"></canvas>
    </div>
  </main>

</div>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
